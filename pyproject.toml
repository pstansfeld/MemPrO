[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mempro"
version = "0.6.0"
description = "Membrane Protein Orientation in Lipid Bilayers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cpu]>=0.6.0,<0.13",
    "matplotlib>=3.8.4",
]

[project.optional-dependencies]
# NVIDIA GPU support (Linux, CUDA 12): pip install "mempro[gpu]"
gpu = ["jax[cuda12]>=0.6.0,<0.13"]

[project.scripts]
mempro = "mempro._cli:main"
insane4mempro = "mempro._cli:insane"
mempro-leaflets = "mempro.leaflet_check:main"
mempro-topology = "mempro.topology:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mempro*"]

[tool.setuptools.package-data]
mempro = ["Insane4MemPrO.py", "martini_v3.itp", "lipidome_m3.dat", "PG_Components/*.itp"]
